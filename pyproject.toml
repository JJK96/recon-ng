[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recon-ng"
version = "5.1.3"
description = "Open Source Intelligence gathering tool aimed at reducing the time spent harvesting information from open sources"
readme = "README.md"
license = {text = "GPL-3.0"}
authors = [
    {name = "Tim Tomes", email = "lanmaster53@gmail.com"}
]
maintainers = [
    {name = "Tim Tomes", email = "lanmaster53@gmail.com"}
]
keywords = ["osint", "reconnaissance", "security", "intelligence", "gathering"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Security Industry",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
requires-python = ">=3.9"

dependencies = [
    "pyyaml",
    "dnspython",
    "lxml",
    "mechanize",
    "requests",
    "aio-pika>=9.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
# Server-only dependencies (for running RPC server)
server = [
    "aio-pika>=9.0.0",
    "pydantic>=2.0.0",
]

# Web interface dependencies
web = [
    "sanic>=23.6.0",
    "sanic-ext>=23.6.0",
    "python-socketio[asyncio_client]>=5.8.0",
    "aio-pika>=9.0.0",
    "pydantic>=2.0.0",
    "dicttoxml",
    "XlsxWriter",
    "unicodecsv",
    "uvicorn>=0.24.0",
    "jinja2>=3.0.0",
]

# All dependencies
all = [
    "sanic>=23.6.0",
    "sanic-ext>=23.6.0",
    "python-socketio[asyncio_client]>=5.8.0",
    "aio-pika>=9.0.0",
    "pydantic>=2.0.0",
    "dicttoxml",
    "XlsxWriter",
    "unicodecsv",
    "uvicorn>=0.24.0",
]

# Development dependencies
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/lanmaster53/recon-ng"
Documentation = "https://github.com/lanmaster53/recon-ng/wiki"
Repository = "https://github.com/lanmaster53/recon-ng"
Issues = "https://github.com/lanmaster53/recon-ng/issues"

[project.scripts]
recon-ng = "recon.client.cli:main"
recon-web = "recon.core.web.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["recon*"]

[tool.setuptools.package-data]
"recon.core.web" = ["templates/*.html", "static/**/*"]
"recon" = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
